<title>404 — Thuan Nguyen</title>
<meta name="theme-color" content="#060a12" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{ min-height:100vh; display:grid; place-items:center; background:hsl(222 47% 5%); color:hsl(210 40% 98%);
    font-family:"JetBrains Mono",monospace; text-align:center; padding:24px; }
  .code{ font-family:"Fraunces",serif; font-weight:400; font-size:clamp(5rem,22vw,12rem); line-height:.9; letter-spacing:-.04em; }
  .code em{ font-style:italic; color:hsl(187 92% 50%); }
  p{ font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:hsl(215 16% 52%); margin:18px 0 28px; }
  a{ display:inline-flex; gap:8px; align-items:center; color:hsl(210 40% 98%); text-decoration:none;
    border:1px solid hsl(217 33% 17%); border-radius:100px; padding:12px 22px; font-size:13px; transition:.2s; }
  a:hover{ background:hsl(187 92% 50%); border-color:hsl(187 92% 50%); color:hsl(222 47% 5%); }
</style>
</head>
<body>
  <div>
    <div class="code">4<em>0</em>4</div>
